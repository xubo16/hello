<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 小说创作助手</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: #1e293b;
        --border: #334155;
        --accent: #a78bfa;
        --accent-2: #38bdf8;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
        background: radial-gradient(1000px 700px at 15% -10%, #4c1d9555, transparent),
          radial-gradient(900px 600px at 100% 0%, #0e749055, transparent), var(--bg);
        color: var(--text);
      }
      header {
        padding: 1.25rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        border-bottom: 1px solid var(--border);
      }
      header h1 { font-size: 1.25rem; margin: 0; }
      header .badge {
        margin-left: auto;
        font-size: 0.78rem;
        padding: 0.3rem 0.7rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      header .badge.ai { color: #04263a; background: var(--accent-2); border-color: transparent; font-weight: 600; }
      header .badge.demo { color: #3b1a00; background: #fbbf24; border-color: transparent; font-weight: 600; }
      main {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 1.25rem;
        padding: 1.25rem 1.5rem;
        align-items: start;
      }
      @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1.25rem;
      }
      label { display: block; font-size: 0.82rem; color: var(--muted); margin: 0.9rem 0 0.35rem; }
      label:first-of-type { margin-top: 0; }
      input, textarea, select {
        width: 100%;
        padding: 0.6rem 0.75rem;
        border-radius: 10px;
        border: 1px solid #475569;
        background: #0b1220;
        color: var(--text);
        font-size: 0.95rem;
        font-family: inherit;
        resize: vertical;
      }
      .actions { display: flex; gap: 0.6rem; margin-top: 1.1rem; }
      button {
        padding: 0.7rem 1.1rem;
        border-radius: 10px;
        border: none;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
      }
      button.primary { background: var(--accent); color: #1a0b3a; flex: 1; }
      button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
      button:disabled { opacity: 0.6; cursor: progress; }
      .story-head { display: flex; align-items: center; margin-bottom: 0.75rem; }
      .story-head h2 { margin: 0; font-size: 1.05rem; }
      .story-head .count { margin-left: auto; font-size: 0.8rem; color: var(--muted); }
      #story {
        min-height: 60vh;
        line-height: 1.9;
        font-size: 1.02rem;
        white-space: pre-wrap;
      }
      #status { margin-top: 0.6rem; font-size: 0.82rem; color: var(--muted); min-height: 1.2rem; }
    </style>
  </head>
  <body>
    <header>
      <span style="font-size:1.4rem">✍️</span>
      <h1>AI 小说创作助手</h1>
      <span class="badge" id="modeBadge">检测中…</span>
    </header>

    <main>
      <section class="panel">
        <label for="title">标题</label>
        <input id="title" placeholder="例如:雾都孤影" />

        <label for="genre">题材</label>
        <input id="genre" placeholder="例如:悬疑 / 玄幻 / 都市言情" />

        <label for="characters">主要人物</label>
        <input id="characters" placeholder="例如:林澈、苏晚" />

        <label for="outline">故事梗概 / 世界设定</label>
        <textarea id="outline" rows="4" placeholder="简单描述背景、冲突或想写的方向"></textarea>

        <label for="instruction">本次写作要求</label>
        <textarea id="instruction" rows="2" placeholder="例如:写开篇,营造紧张氛围"></textarea>

        <div class="actions">
          <button class="primary" id="generate">生成续写</button>
          <button class="ghost" id="clear">清空正文</button>
        </div>
        <div id="status"></div>
      </section>

      <section class="panel">
        <div class="story-head">
          <h2>小说正文</h2>
          <span class="count" id="count">0 字</span>
        </div>
        <div id="story" contenteditable="true" spellcheck="false"></div>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const story = $("story");
      const status = $("status");
      const badge = $("modeBadge");

      function updateCount() {
        const len = story.innerText.replace(/\s/g, "").length;
        $("count").textContent = `${len} 字`;
      }
      story.addEventListener("input", updateCount);

      async function loadConfig() {
        try {
          const res = await fetch("/api/config");
          const cfg = await res.json();
          if (cfg.aiConfigured) {
            badge.textContent = `AI 已启用 · ${cfg.model}`;
            badge.className = "badge ai";
          } else {
            badge.textContent = "演示模式(未配置 API 密钥)";
            badge.className = "badge demo";
          }
        } catch {
          badge.textContent = "配置读取失败";
        }
      }

      async function generate() {
        const btn = $("generate");
        btn.disabled = true;
        status.textContent = "正在生成…";
        try {
          const res = await fetch("/api/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title: $("title").value,
              genre: $("genre").value,
              characters: $("characters").value,
              outline: $("outline").value,
              instruction: $("instruction").value,
              previousText: story.innerText,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
          const prefix = story.innerText.trim() ? "\n\n" : "";
          story.innerText = story.innerText + prefix + data.text;
          updateCount();
          status.textContent = data.mode === "ai" ? `已用 ${data.model} 生成` : "已用演示模式生成";
        } catch (err) {
          status.textContent = "生成失败:" + err.message;
        } finally {
          btn.disabled = false;
        }
      }

      $("generate").addEventListener("click", generate);
      $("clear").addEventListener("click", () => { story.innerText = ""; updateCount(); status.textContent = ""; });

      loadConfig();
      updateCount();
    </script>
  </body>
</html>
